<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amorim Firmo — Advocacia e Consultoria Jurídica</title>
<meta name="description" content="Gestão processual, portal do cliente e auditoria de contratos do escritório Amorim Firmo.">
<meta name="theme-color" content="#121c33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121c33;--ink-2:#1a2747;--ink-3:#24345c;--gold:#b08a4e;--gold-2:#d9c49a;--gold-3:#efe4cc;
  --ivory:#f6f3ec;--paper:#fffdf9;--line:#e7e0d2;--line-strong:#d6ccb8;--text:#1d2433;--muted:#6b6f7b;
  --good:#2e7d4f;--warning:#b7791f;--serious:#c2571d;--critical:#b4233c;--info:#2f6bb3;--muted-mark:#9aa0ab;
  --s1:#2f6bb3;--s2:#c98a1e;--s3:#1d9a7c;--s4:#7056c9;--s5:#c4485e;--chart-bg:#fffdf9;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;--shadow:0 1px 2px rgba(18,28,51,.04),0 8px 24px -12px rgba(18,28,51,.12);
}
*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 var(--sans);color:var(--text);background:var(--ivory);-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
a{color:var(--ink-3);text-decoration:none}a:hover{color:var(--gold)}
h1,h2,h3,h4{margin:0;font-weight:600;color:var(--ink)}
.ic{width:18px;height:18px;flex:none;vertical-align:-3px}.ic.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11px}.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sp{flex:1}.right{display:flex;justify-content:flex-end;margin-top:14px}.pad{padding:10px 14px}
.caption{font:600 10.5px/1.4 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-2);text-align:center}
.caption.dark{color:var(--gold)}
.eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}

/* ---------- SPLASH ---------- */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 30%,#22325a 0%,#121c33 55%,#0b1222 100%);transition:opacity .8s ease,visibility .8s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:0}
#splash img{width:min(210px,52vw);opacity:0;transform:translateY(10px) scale(.96);animation:spIn 1.1s .15s cubic-bezier(.2,.7,.2,1) forwards;filter:drop-shadow(0 10px 30px rgba(0,0,0,.35))}
#splash .sp-rule{height:1px;width:0;background:linear-gradient(90deg,transparent,var(--gold-2),transparent);margin:22px 0 16px;animation:spRule 1s .9s ease forwards}
#splash .caption{opacity:0;letter-spacing:.6em;animation:spCap 1.1s 1.1s ease forwards}
#splash .sp-dots{display:flex;gap:7px;margin-top:34px;opacity:0;animation:spFade .6s 1.5s forwards}
#splash .sp-dots i{width:5px;height:5px;border-radius:50%;background:var(--gold-2);animation:dot 1.2s infinite ease-in-out}
#splash .sp-dots i:nth-child(2){animation-delay:.15s}#splash .sp-dots i:nth-child(3){animation-delay:.3s}
@keyframes spIn{to{opacity:1;transform:none}}@keyframes spRule{to{width:180px}}@keyframes spCap{to{opacity:1;letter-spacing:.32em}}@keyframes spFade{to{opacity:1}}
@keyframes dot{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-brand{position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px;
  background:radial-gradient(90% 70% at 50% 35%,#24345c 0%,#16223f 50%,#0d152a 100%)}
.login-brand::before{content:"";position:absolute;inset:22px;border:1px solid rgba(217,196,154,.22);border-radius:4px;pointer-events:none}
.login-brand::after{content:"";position:absolute;inset:30px;border:1px solid rgba(217,196,154,.1);border-radius:2px;pointer-events:none}
.lb-inner{position:relative;text-align:center;max-width:420px;animation:fadeUp .9s ease both}
.lb-logo{width:min(250px,60%);filter:drop-shadow(0 12px 28px rgba(0,0,0,.35))}
.lb-inner .caption{margin-top:12px}
.lb-tag{font:500 italic 21px/1.4 var(--serif);color:#e9e2d2;margin:34px auto 0;max-width:340px;padding-top:26px;border-top:1px solid rgba(217,196,154,.35)}
.lb-foot{position:absolute;bottom:40px;font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.08em}
.login-form{display:grid;place-items:center;padding:40px 24px;background:var(--ivory)}
.lf-card{width:100%;max-width:400px;animation:fadeUp .9s .15s ease both}
.lf-card h1{font:600 36px/1.15 var(--serif);margin:0 0 8px}
.lf-card>div>p.muted,.lf-card form>p.muted{margin:0 0 26px}
.lf-logo-m,.lf-cap-m{display:none}
.gbtn{min-height:44px;margin:4px 0 14px}
.note{font-size:12.5px;color:var(--muted);margin:10px 0}
.code-input{font:600 30px var(--sans)!important;letter-spacing:.5em;text-align:center;padding:14px!important}
.row-btns{display:flex;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- BOTÕES / FORM ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font:600 13.5px var(--sans);cursor:pointer;white-space:nowrap;transition:.15s;color:var(--ink);background:transparent}
.btn.primary{background:var(--ink);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 4px 12px -4px rgba(18,28,51,.4)}
.btn.primary:hover{background:var(--ink-3)}
.btn.ghost{border-color:var(--line-strong);background:var(--paper)}.btn.ghost:hover{border-color:var(--gold);color:var(--ink)}
.btn.ghost.light{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.btn.danger{background:var(--critical);color:#fff}.danger-text{color:var(--critical)!important}
.btn.block{width:100%;height:46px}.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:rgba(18,28,51,.06);color:var(--ink)}.icon-btn.sm{width:28px;height:28px}.icon-btn.light{color:#fff}
.link{background:none;border:0;padding:0;color:var(--ink-3);font:600 13px var(--sans);cursor:pointer;text-decoration:underline;text-decoration-color:var(--gold-2);text-underline-offset:3px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}.btn-row.center{justify-content:center}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}.fld.full{grid-column:1/-1}
.fld label{font-size:12px;font-weight:600;color:#4a4f5c}.fld small{font-size:11.5px;color:var(--muted)}
.req{color:var(--critical)}.calc{font-style:normal;font-weight:500;color:var(--gold);font-size:11px}
input,select,textarea{font:14px var(--sans);color:var(--text);background:#fff;border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;width:100%;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,138,78,.18)}
input[readonly]{background:var(--ivory);color:var(--muted)}input.invalid{border-color:var(--critical)}
.fld.gap input,.fld.gap textarea{background:#fff8ec;border-color:#e6c98f}
textarea{resize:vertical}
.grid-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px;font-weight:500}
.switch input{position:absolute;opacity:0;width:0}
.switch span{width:38px;height:22px;border-radius:12px;background:var(--line-strong);position:relative;flex:none;transition:.2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--ink)}.switch input:checked+span::after{left:19px}
.switch input:focus-visible+span{box-shadow:0 0 0 3px rgba(176,138,78,.35)}
.chips-select{display:flex;flex-wrap:wrap;gap:6px}
.chip-opt{cursor:pointer}.chip-opt input{position:absolute;opacity:0}
.chip-opt span{display:inline-block;padding:6px 12px;border:1px solid var(--line-strong);border-radius:20px;font-size:12.5px;background:#fff}
.chip-opt input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip-add{display:inline-flex;gap:4px;align-items:center;padding:6px 12px;border:1px dashed var(--gold);border-radius:20px;background:none;color:var(--gold);font:600 12.5px var(--sans);cursor:pointer}
.notice{display:flex;gap:12px;padding:13px 15px;border-radius:12px;background:#fff6e6;border:1px solid #efd9ad;font-size:13px;margin:16px 0}
.notice .ic{color:var(--warning);margin-top:1px}.notice.soft{background:#f3f1ea;border-color:var(--line)}.notice.soft .ic{color:var(--gold)}
.notice.warn{background:#fff8ec}

/* ---------- ESTRUTURA ---------- */
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:272px;background:linear-gradient(180deg,#141f3a 0%,#101a31 100%);color:#d7dbe6;display:flex;flex-direction:column;z-index:40;overflow:hidden}
.side-close{display:none;position:absolute;right:10px;top:10px;color:#fff}
.side-brand{display:flex;flex-direction:column;align-items:center;padding:26px 20px 18px;border-bottom:1px solid rgba(217,196,154,.14)}
.side-brand img{width:104px}.side-brand .caption{margin-top:8px;font-size:8.5px}
.side-profile{display:flex;align-items:center;gap:11px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.side-profile b{display:block;color:#fff;font-size:13.5px;line-height:1.25}.side-profile small{display:block;color:#98a0b5;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.side-profile .role{display:inline-block;margin-top:3px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-2)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--gold),#8c6a37);color:#fff;font:600 17px var(--serif);overflow:hidden;border:2px solid rgba(217,196,154,.5)}
.avatar.img{object-fit:cover}.avatar img{width:100%;height:100%;object-fit:cover}.avatar.sm{width:34px;height:34px;font-size:14px;border-width:1px}
.nav{padding:10px 12px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2a3a63 transparent}
.nav-h{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#7f8aa6;padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:#c9cfdd;font-weight:500;font-size:13.5px;position:relative}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:rgba(217,196,154,.12);color:#fff}.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold-2)}
.nav a .ic{color:#8d98b4}.nav a.on .ic{color:var(--gold-2)}
.nav a em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;color:#98a0b5;background:rgba(255,255,255,.06);border-radius:10px;padding:1px 8px}
.nav a.sub{padding:6px 10px 6px 39px;font-size:12.5px;color:#a7aec0}.nav a.sub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{padding:12px 12px 18px;border-top:1px solid rgba(255,255,255,.06)}
.side-btn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:9px;color:#c9cfdd;font:500 13.5px var(--sans);background:none;border:0;cursor:pointer;text-align:left}
.side-btn:hover,.side-btn.on{background:rgba(255,255,255,.06);color:#fff}.side-btn.danger:hover{color:#ffb4b4}
.pend-badge{margin-left:auto;background:var(--critical);color:#fff;font:700 11px var(--sans);font-style:normal;border-radius:10px;padding:1px 7px}
.side-ver{text-align:center;font-size:10.5px;color:#6f7a96;margin-top:12px;line-height:1.6}.side-ver .link{color:#98a0b5;font-size:10.5px;text-decoration-color:#4a5677}
.scrim{display:none}
.main{flex:1;margin-left:272px;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:62px;padding:0 26px;background:rgba(246,243,236,.86);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.menu-btn{display:none;align-items:center;gap:6px;height:38px;padding:0 8px;border:1px solid var(--line-strong);border-radius:20px;background:var(--paper);cursor:pointer;color:var(--ink);position:relative}
.menu-btn img{width:26px;height:26px;border-radius:50%}.menu-btn .pend-badge{position:absolute;top:-6px;right:-6px}
.top-logo{height:36px;display:none}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}.crumbs .sep{color:var(--line-strong)}
.gsearch{position:relative;width:min(340px,32vw)}
.gsearch .ic{position:absolute;left:11px;top:11px;color:var(--muted)}.gsearch input{padding-left:36px;height:40px;border-radius:20px;background:var(--paper)}
.gresults{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:420px;overflow:auto;padding:6px}
.gresults a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--text)}.gresults a:hover{background:var(--ivory)}
.gresults b{display:block;font-size:13px}.gresults small{color:var(--muted);font-size:11.5px}
.sync{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--paper);font:600 11.5px var(--sans);color:var(--muted);cursor:pointer}
.sync.ok .ic{color:var(--good)}.sync.warn{color:var(--warning)}.sync.local .ic{color:var(--gold)}
.view{padding:28px 30px 60px;max-width:1440px;width:100%;margin:0 auto}

/* ---------- PÁGINAS ---------- */
.page-h,.ws-h{display:flex;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.page-h h1,.ws-h h1{font:600 34px/1.1 var(--serif);letter-spacing:-.01em}.page-h p,.ws-h p{margin:6px 0 0}
.page-h>div:first-child,.ws-h>div:nth-child(2){flex:1;min-width:240px}
.h-ic{width:26px;height:26px;color:var(--gold);vertical-align:-2px}
.actions{display:flex;gap:10px}.actions.wrap{flex-wrap:wrap}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px;min-width:0}
.card.flush{padding:0;overflow:hidden}.card>header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card h2{font:600 15px var(--sans);display:flex;align-items:center;gap:8px}.card h2 .ic{color:var(--gold)}
.card h2 .count,.sec .count{font:600 11px var(--sans);background:var(--ivory);border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--muted)}
.hdr-actions{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:18px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpis.sm{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.kpis.xs{grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{display:flex;flex-direction:column;gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;position:relative;overflow:hidden;color:var(--text);box-shadow:var(--shadow)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold-2)}
.kpi.warn::before{background:var(--warning)}.kpi.bad::before{background:var(--critical)}
a.kpi:hover{border-color:var(--gold-2);color:var(--text)}
.kpi-l{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.kpi-v{font:600 30px/1.1 var(--serif);color:var(--ink);font-variant-numeric:lining-nums tabular-nums}.kpi-v small{font-size:17px;color:var(--muted)}
.kpi-s{font-size:11.5px;color:var(--muted)}.t-bad{color:var(--critical)}
.kpis.xs .kpi{padding:11px 13px}.kpis.xs .kpi-v{font-size:22px}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}.empty .ic{width:30px;height:30px;color:var(--gold-2)}.empty p{margin:8px 0 0}
.empty.sm{padding:24px 10px}.empty.big{padding:70px 20px}.empty h3{font:600 24px var(--serif);margin-top:10px}.empty .btn{margin-top:16px}
.pill{font-family:var(--sans);display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;background:#eef0f4;color:#4a4f5c}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.good{background:#e7f3ec;color:var(--good)}.pill.warning{background:#fbf1de;color:#93600f}.pill.serious{background:#fdeee4;color:var(--serious)}.pill.critical{background:#fbe8eb;color:var(--critical)}.pill.info{background:#e8eff9;color:var(--info)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--gold-3);color:#7a5a26;letter-spacing:.02em}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:#e8eff9;color:var(--info)}
.badge.soft{background:var(--ivory);color:var(--muted)}
.seg-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.seg-tabs button{height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line-strong);background:var(--paper);font:600 12.5px var(--sans);cursor:pointer;color:var(--muted)}
.seg-tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}.seg-tabs select{width:auto;height:32px;padding:0 10px;border-radius:16px;font-size:12.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs.scroll{overflow-x:auto;scrollbar-width:none}.tabs.scroll::-webkit-scrollbar{display:none}
.tabs a{display:flex;align-items:center;gap:7px;padding:11px 14px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}.tabs a.on{color:var(--ink);border-bottom-color:var(--gold)}
.tabs a em{font-style:normal;font-size:10.5px;background:var(--ivory);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--muted)}
.tabs a .pend-badge{margin-left:2px}

/* tabelas */
.dt-tools{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dt-tools .search{position:relative;width:min(300px,100%)}.dt-tools .search .ic{position:absolute;left:10px;top:10px;color:var(--muted)}
.dt-tools .search input{padding-left:34px;height:38px}.dt-tools select{width:auto;max-width:220px;height:38px}
.table-wrap{overflow-x:auto}
.modal-body:has(.tw-fixa){display:flex;flex-direction:column;overflow:hidden;min-height:0}.tw-fixa{overflow:auto;flex:1;min-height:120px}.tw-fixa thead th{position:sticky;top:0;z-index:2;background:var(--paper)}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);background:#faf8f3;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
.dt td{padding:11px 14px;border-bottom:1px solid #f0ebe1;vertical-align:top}.dt td.wrap{min-width:240px;max-width:420px}
.dt tbody tr[data-id]{cursor:pointer}.dt tbody tr[data-id]:hover td{background:#fbf8f1}
.dt .r,.mini .r{text-align:right}.dt tr.totals td{font-weight:700;background:#faf8f3;border-top:1px solid var(--line)}
.neg{color:var(--critical)}.pos{color:var(--good)}.nil{color:#c7c2b6}
.gapcell{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:#9a6b1e;background:#fff6e6;border-radius:5px;padding:1px 6px;white-space:nowrap}.gapcell .ic{width:13px;height:13px}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 16px;font-size:12.5px;color:var(--muted)}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px}.mini th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.mini td{padding:7px 8px;border-bottom:1px solid #f0ebe1;vertical-align:top}.mini tr[data-rel]{cursor:pointer}.mini tr[data-rel]:hover td{background:#fbf8f1}

/* listas */
.agenda-list,.feed,.alerts,.plain{list-style:none;margin:0;padding:0}
.agenda-list li a,.agenda-list li{display:flex;align-items:center;gap:14px;color:var(--text)}
.agenda-list>li{border-bottom:1px solid #f0ebe1}.agenda-list>li:last-child{border:0}.agenda-list li a{padding:10px 4px;flex:1}
.agenda-list>li:not(:has(a)){padding:10px 4px}
.ag-date{width:52px;text-align:center;flex:none;border-right:1px solid var(--line);padding-right:10px}.ag-date b{display:block;font:600 19px var(--serif);color:var(--ink)}.ag-date small{color:var(--muted);font-size:11px}
.ag-body{flex:1;min-width:0}.ag-body small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.ag-when{font-size:11.5px;color:var(--muted);white-space:nowrap}
.agenda-list li.late .ag-when{color:var(--critical);font-weight:700}.agenda-list li.soon .ag-when{color:var(--warning);font-weight:700}
.agenda-list li.done{opacity:.55}.agenda-list li.done b{text-decoration:line-through}
.agenda-list.compact .ag-body small{display:none}
.feed li a{display:flex;gap:12px;padding:9px 2px;border-bottom:1px solid #f0ebe1;color:var(--text);align-items:flex-start}
.feed time{font-size:11.5px;color:var(--muted);width:72px;flex:none;padding-top:2px}.feed b{display:block;font-size:13px;font-weight:600}.feed small{color:var(--muted);font-size:11.5px}.feed div{flex:1}
.alerts li a{display:flex;gap:10px;padding:9px 10px;border-radius:9px;color:var(--text);margin-bottom:4px}.alerts li a:hover{background:var(--ivory)}
.alerts li.bad .ic{color:var(--critical)}.alerts li.warn .ic{color:var(--warning)}.alerts b{display:block;font-size:13px}.alerts small{color:var(--muted);font-size:11.5px}
.plain li{padding:6px 0}.plain li a{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.checks li{display:flex;gap:8px;align-items:flex-start}.checks .ic{color:var(--good);margin-top:2px}.cols2{columns:2;column-gap:30px}.cols2 li{break-inside:avoid}

/* processo */
.proc-h{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px;align-items:flex-end}
.proc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.proc-num{font:600 30px var(--serif)}.proc-sub{margin:4px 0;color:var(--muted)}.proc-parts{margin:6px 0 0}.vs{color:var(--gold);margin:0 6px;font-weight:700}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:1px solid var(--line-strong)}
.timeline li{position:relative;padding:4px 0 16px 14px}
.tl-dot{position:absolute;left:-24px;top:9px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--gold)}
.timeline li:first-child .tl-dot{background:var(--gold)}
.tl-head{display:flex;align-items:center;gap:8px}.tl-head time,.timeline time{font-size:12px;font-weight:700;color:var(--muted)}
.tl-t{display:block;font-size:14px;margin-top:2px}.timeline p{margin:4px 0 0;color:#4a4f5c;font-size:13px}
.explain{display:flex;gap:6px;background:#f6f1e6;border-radius:8px;padding:7px 10px;color:#5d4a2a!important}.explain .ic{color:var(--gold);width:15px;height:15px;margin-top:2px}
.hidden-mov{opacity:.6}.hidden-mov .tl-dot{border-color:var(--muted-mark)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0;font-size:13px}.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.dl.cols{grid-template-columns:auto 1fr auto 1fr}
.note-box{margin-top:12px;background:var(--ivory);border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-wrap}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin:10px 0 6px;font-size:13px}.detail-grid .full{grid-column:1/-1}
.sec{font:600 13px var(--sans);margin:20px 0 8px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}

/* empresas */
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.emp-card{display:flex;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);color:var(--text);transition:.15s}
.emp-card:hover{border-color:var(--gold-2);transform:translateY(-1px);color:var(--text)}
.emp-ini{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--ink);color:var(--gold-2);font:600 19px var(--serif);flex:none;letter-spacing:.04em}
.emp-ini.lg{width:62px;height:62px;font-size:24px;border-radius:16px;align-self:center}
.emp-body{flex:1;min-width:0}.emp-body>b{font:600 19px var(--serif);display:block}.emp-body>small{color:var(--muted);font-size:12px}
.emp-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}.emp-stats b{color:var(--ink)}
.insight ul{margin:0;padding-left:18px}.insight li{margin:5px 0}.insight{border-left:3px solid var(--gold)}

/* gráficos */
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:#eee8dc;stroke-width:1}.chart .axis0{stroke:#c9c1b0;stroke-width:1}.chart .tick{font:11px var(--sans);fill:var(--muted)}
.chart .xhair{stroke:var(--line-strong);stroke-dasharray:3 3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#4a4f5c;margin-bottom:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart-empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(176,138,78,.04) 10px 20px);border-radius:10px}
.tbl-toggle{margin-top:6px;font-size:12px}.chart-table{margin-top:8px;max-height:260px;overflow:auto}
.tip{position:fixed;z-index:999;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px -8px rgba(18,28,51,.3);padding:9px 12px;font-size:12.5px;min-width:180px;display:none}
.tip-h{font-weight:700;margin-bottom:5px;color:var(--ink)}.tip-row{display:flex;align-items:center;gap:8px;padding:1px 0}.tip-row i{width:9px;height:9px;border-radius:3px}.tip-row span{flex:1;color:var(--muted)}.tip-row b{font-variant-numeric:tabular-nums}
.tip-row.total{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(90px,40%) 1fr auto;align-items:center;gap:10px;font-size:12.5px}
.hbar-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#4a4f5c}.hbar-t{height:10px;background:#f1ece2;border-radius:5px;overflow:hidden}.hbar-t span{display:block;height:100%;border-radius:0 5px 5px 0}
.hbar-v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.logo-mini{width:18px;height:18px;object-fit:contain;border-radius:4px}
.rm-top .rm-sel{display:flex;gap:12px;flex-wrap:wrap}.rm-top label,.rm-grid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:#5b6070}.rm-st{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.rm-ct header{display:block}.rm-ct h3{margin:0;font-size:15px}.rm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px;margin-top:10px}.rm-grid .full{grid-column:1/-1}.rm-grid label.chk,.rm-dv label.chk{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.rm-docs{display:flex;flex-direction:column;gap:6px}.rm-doc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e7e0d2;border-radius:10px;background:#fff}.rm-doc.ok{border-color:#9cc9a8;background:#f4fbf6}.rm-doc b{font-size:13.5px;display:flex;align-items:center;gap:6px}.rm-doc b em{font-style:normal;font-size:11px;color:#a36a00;font-weight:600}.rm-doc small{display:block;font-size:12px;margin-top:2px}.rm-doc svg{width:15px;height:15px;color:#2e7d4f}
.rm-dv{display:flex;flex-direction:column;gap:6px;min-width:0}.rm-dv input,.rm-grid .chk input{width:auto!important;flex:none;margin:2px 0 0;height:auto}.rm-dv label>span.pill{flex:none}.rm-dv label{min-width:0;overflow-wrap:anywhere}.rm-rev label.full{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;margin-top:10px}.rm-dv label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid #e7e0d2;border-radius:10px;background:#fff;font-size:13px}
.conn-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:linear-gradient(160deg,#fbf8f1,#efe7d6);transition:opacity .5s}.conn-splash.out{opacity:0}.cs-card{width:min(340px,86vw);background:#fff;border-radius:22px;padding:26px 18px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.09);animation:csUp .6s both}
.cs-pair{display:flex;align-items:center;justify-content:center;gap:14px}.cs-af{width:84px;height:100px;object-fit:contain;animation:csL .6s .2s both}.cs-x{font:300 30px var(--serif);color:#b08a3e;animation:csF .4s .7s both}.cs-cli{width:84px;height:84px;border-radius:20px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.12);display:grid;place-items:center;overflow:hidden;animation:csR .6s .2s both}.cs-cli img{max-width:76px;max-height:76px;object-fit:contain}.cs-cli span{font:800 24px var(--sans);color:#0f6b5c}
.cs-t{font:700 17px var(--serif);margin-top:14px;color:var(--ink)}.cs-s{font-size:12px;color:#6b7080;margin-top:2px}.cs-bar{height:4px;border-radius:4px;background:#eee;margin:18px 12px 0;overflow:hidden}.cs-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b08a3e,#0f6b5c);animation:csB 2.6s .6s forwards}.cs-st{font-size:12px;color:#6b7080;margin-top:9px;min-height:16px}.cs-skip{position:absolute;bottom:26px;font-size:11.5px;color:#9a917f}
@keyframes csUp{from{opacity:0;transform:translateY(20px)}}@keyframes csL{from{opacity:0;transform:translateX(-40px)}}@keyframes csR{from{opacity:0;transform:translateX(40px)}}@keyframes csF{from{opacity:0}}@keyframes csB{to{width:100%}}
.pn-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}.pn-tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 14px;border:1px solid #e7e0d2;border-top:4px solid;border-radius:16px;background:#fffdf8;font:inherit;color:var(--ink);text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}.pn-tabs button.jud{border-top-color:#2f5aa8}.pn-tabs button.con{border-top-color:#b08a3e}.pn-tabs button svg{width:18px;height:18px;color:#8a8f9c}.pn-tabs button b{font-size:16.5px}.pn-tabs button small{font-size:12px;color:#6b7080;line-height:1.35}.pn-tabs button:not(.on){opacity:.75}.pn-tabs button.on{opacity:1;box-shadow:0 0 0 2px var(--ink) inset,0 4px 14px rgba(0,0,0,.06)}.pn-tabs button.jud.on svg{color:#2f5aa8}.pn-tabs button.con.on svg{color:#b08a3e}.pn-sec{display:flex;align-items:center;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid}.pn-sec h2{display:flex;align-items:center;gap:8px;margin:0;font-family:var(--serif);font-size:22px}.pn-sec.jud{border-color:#2f5aa8;color:#2f5aa8}.pn-sec.con{border-color:#b08a3e;color:#8a6a28}.pn-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pn-btns .btn{flex:1 1 180px;justify-content:center}
.pes-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:4px 0 16px}.pes-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid #e7e0d2;border-radius:14px;background:#fffdf8;cursor:pointer;font:inherit;color:inherit;text-align:left}.pes-card svg{width:22px;height:22px;color:#b08a3e;flex:none}.pes-card b{display:block;font-size:15px}.pes-card small{color:#6b7080;font-size:12.5px}.pes-card:hover{border-color:#c9a45c}.pes-card.on{border-color:#16213a;box-shadow:inset 0 0 0 1px #16213a;background:#fff}.pes-card.nd svg{color:var(--warning)}
.parc-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 10px}.parc-h h2{display:flex;align-items:center;gap:8px;font-size:18px;margin:0}.parc-h h2 small{font-size:13px;font-weight:500}.parc-l{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}.parc-i{display:grid;grid-template-columns:1fr minmax(0,200px) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid #e7e0d2;border-radius:10px;background:#fff}.parc-i small{display:block;font-size:12px}@media(max-width:600px){.parc-i{grid-template-columns:1fr auto}.parc-i input{grid-column:1/-1;grid-row:2}}
[data-djrep],[data-rep]{min-width:180px;max-width:260px}.rep-sel{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#5b6070}.rep-sel select{max-width:240px}.hbar[hidden]{display:none}.hb-more{align-self:flex-start;margin-top:2px}.clic{cursor:pointer}.hbar.clic:hover .hbar-l,.seglegend .clic:hover{text-decoration:underline}tr.clic:hover td{background:#f7f3ea}
.venc-l{display:flex;flex-direction:column;gap:6px}.venc-i{display:flex;justify-content:space-between;gap:12px;text-align:left;width:100%;padding:10px 12px;border:1px solid #e7e0d2;border-radius:10px;background:#fff;cursor:pointer;font:inherit;color:inherit}.venc-i:hover{background:#f7f3ea}.venc-i small{display:block;font-size:12px;margin-top:2px}.venc-i .r{text-align:right;white-space:nowrap}.venc-i .bad{color:var(--critical)}
.segbar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin:4px 0 10px}.segbar span{display:block}
.seglegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:#4a4f5c}.seglegend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}.seglegend em{color:var(--muted);font-style:normal}

/* gestão */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metrics div{display:flex;flex-direction:column}.metrics b{font:600 26px var(--serif);color:var(--ink)}.metrics span{font-size:11.5px;color:var(--muted)}
.ver ul{margin:6px 0 10px;padding-left:18px;font-size:13px}
.u-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f0ebe1}.u-row:last-of-type{border:0}
.u-who{flex:1;min-width:0}.u-who b{display:block}.u-who small{display:block;color:var(--muted);font-size:11.5px}
.u-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.u-act select{width:auto;height:32px;font-size:12.5px;padding:0 8px}
.conn{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0ebe1}.conn div{flex:1}.conn b{display:block;font-size:13.5px}.conn small{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.dot.ok{background:var(--good);box-shadow:0 0 0 4px #e7f3ec}.dot.off{background:var(--muted-mark);box-shadow:0 0 0 4px #eef0f4}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}.h3{font-size:14px;display:flex;gap:8px;align-items:center}
.about{text-align:center}.about-logo{width:110px}.about p{text-align:left}.about .checks{text-align:left;font-size:13px}

/* modal / toast */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(13,21,42,.5);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;animation:fade .18s}
.modal{background:var(--paper);border-radius:18px;width:min(620px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(980px,100%)}.modal,.modal-body{min-width:0}
.modal header{display:flex;align-items:flex-start;gap:10px;padding:20px 22px 12px;border-bottom:1px solid var(--line)}.modal header>div{flex:1;min-width:0}
.modal header h3{font:600 23px/1.2 var(--serif)}.modal header p{margin:3px 0 0;color:var(--muted);font-size:13px}
.modal-body{padding:18px 22px;overflow:auto}
.modal footer{display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:#fbf9f4;border-radius:0 0 18px 18px;flex-wrap:wrap}
.confirm-msg{font-size:15px;margin:0}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);font-size:13.5px;animation:pop .25s;transition:.3s}
.toast.ok .ic{color:#8fd4ad}.toast.bad{background:#7d1b2c}.toast.warn{background:#6b4a12}.toast.out{opacity:0;transform:translateY(8px)}

/* relatório (sobreposição) */
.report-ov{position:fixed;inset:0;z-index:200;background:#2a2f3a;display:flex;flex-direction:column}
.report-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ink);color:#fff}.report-bar b{display:flex;gap:8px;align-items:center;font-weight:600}
.report-ov iframe{flex:1;border:0;background:#e9e6df}

/* portal */
.portal{min-height:100vh;background:var(--ivory)}
.p-top{display:flex;align-items:center;gap:14px;padding:12px max(16px,calc((100vw - 1000px)/2));background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.p-logo{height:46px}.p-brand b{display:block;font:600 19px var(--serif);color:var(--ink)}.p-brand .caption{text-align:left;font-size:9px;letter-spacing:.24em}
.p-hero{padding:34px max(16px,calc((100vw - 1000px)/2)) 22px;background:radial-gradient(80% 140% at 85% 0%,#22325a,#121c33);color:#fff}
.p-hero .eyebrow{color:var(--gold-2)}.p-hero h1{font:600 36px var(--serif);color:#fff}.p-hero p{color:#c9cfdd;max-width:620px;margin:6px 0 0}
.p-tabs{display:flex;gap:4px;padding:0 max(16px,calc((100vw - 1000px)/2));background:var(--ink);overflow-x:auto}
.p-tabs button{background:none;border:0;color:#aeb6c9;font:600 13.5px var(--sans);padding:13px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.p-tabs button.on{color:#fff;border-bottom-color:var(--gold-2)}
.p-main{max-width:1000px;margin:0 auto;padding:24px 16px 50px}
.p-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.p-card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;font:inherit;color:var(--text);box-shadow:var(--shadow);transition:.15s}
